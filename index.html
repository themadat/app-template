<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A minimal static application shell.">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="App Template">
  <meta name="mobile-web-app-capable" content="yes">
  <title>App Template</title>
  <link id="appManifest" rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="assets/icons/splash-light.png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-startup-image" href="assets/icons/splash-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/css/app.css">
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>

  <header class="app-header">
    <div class="title-cluster">
      <button id="appIconButton" class="app-icon-button" type="button" aria-label="Switch color theme. Press and hold to toggle Developer Mode" title="Switch color theme · Press and hold for Developer Mode">
        <img id="appIcon" src="assets/icons/app-icon-light.svg" alt="">
      </button>

      <div class="identity-copy">
        <span id="appName" class="app-name">App Template</span>
        <div class="identity-pill-row">
          <span id="versionPill" class="version-pill">v1.0.0</span>
          <span id="betaPill" class="environment-pill" title="This is the beta application" hidden>BETA</span>
        </div>
      </div>
    </div>

    <nav class="top-toolbar" aria-label="Application actions">
      <button class="top-action primary" type="button" data-app-action="primary">
        <span class="action-icon" aria-hidden="true" data-symbol="add"></span>
        <span class="action-label">Add</span>
      </button>
      <button class="top-action" type="button" data-app-action="more" aria-label="More actions">
        <span class="action-icon" aria-hidden="true" data-symbol="more"></span>
        <span class="action-label">More</span>
      </button>
    </nav>
  </header>

  <main id="mainContent" class="app-content" tabindex="-1"></main>
</body>
</html>
